[project]
name = "live-form-eval"
version = "0.1.0"
description = "Evaluate extractors that fill a form from a live transcript, on SpokenWOZ and AMI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "rapidfuzz>=3",
    "pandas>=2.2",
    "altair>=5.3",
    "sentence-transformers>=3",  # the free-text judge (NLI)
    "torch>=2.3",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.28"]      # Apple Silicon: local language models (the LLM judge, the organisers' annotation tools)
claude = ["anthropic>=2.8"] # the organisers' annotation tools
openai = ["openai>=1.40"]   # examples/llm_extractor.py

[project.scripts]
lfe = "live_form_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5", "ruff>=0.6",
       "anthropic>=2.8"]  # the Claude backend is tested with a stand-in client, but needs the SDK's types

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["live_form_eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
